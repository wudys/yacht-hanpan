name: Deploy production
run-name: Deploy production from ${{ github.ref_name }}

on:
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  deploy:
    name: Build and deploy the verified commit
    needs: ci
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    environment: production
    env:
      VITE_GAME_SERVER_URL: ${{ secrets.VITE_GAME_SERVER_URL }}
      VITE_SITE_ORIGIN: ${{ secrets.VITE_SITE_ORIGIN }}
      VITE_DEPLOYMENT_ENV: production
      RENDER_SERVICE_ID: ${{ secrets.RENDER_SERVICE_ID }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_PAGES_PROJECT: ${{ secrets.CLOUDFLARE_PAGES_PROJECT }}
    steps:
      - name: Check out the verified commit
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: package.json

      - name: Set up Node for Wrangler
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Validate deployment settings
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          bun scripts/deploy-render.mjs --check
          : "${CLOUDFLARE_API_TOKEN:?Set the CLOUDFLARE_API_TOKEN secret}"
          [[ "$CLOUDFLARE_ACCOUNT_ID" =~ ^[a-f0-9]{32}$ ]] || { echo 'Set a valid CLOUDFLARE_ACCOUNT_ID secret'; exit 1; }
          [[ "$CLOUDFLARE_PAGES_PROJECT" =~ ^[a-z0-9][a-z0-9-]*$ ]] || { echo 'Set a valid CLOUDFLARE_PAGES_PROJECT secret'; exit 1; }
          curl --fail --silent --show-error --max-time 30 \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects/$CLOUDFLARE_PAGES_PROJECT" \
            | jq -e '.success == true and .result.production_branch == "main"' > /dev/null \
            || { echo 'Pages project must exist and use main as its production branch'; exit 1; }

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build production web and upload private source maps
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
        run: bun --filter @repo/web build

      - name: Deploy the same commit to Render and wait for readiness
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
        run: bun scripts/deploy-render.mjs

      - name: Upload web to Pages production
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          bunx wrangler@4.147.0 pages deploy apps/web/dist \
            --project-name "$CLOUDFLARE_PAGES_PROJECT" \
            --branch main \
            --commit-hash "$GITHUB_SHA" \
            --commit-dirty=false

      - name: Record deployment
        run: |
          RELEASE_VERSION=$(bun -p 'require("./packages/product-release/release.json").version')
          {
            echo "Commit: $GITHUB_SHA"
            echo "Release: $RELEASE_VERSION"
            echo 'Render is live and ready; the web build was uploaded to Pages production.'
          } >> "$GITHUB_STEP_SUMMARY"
